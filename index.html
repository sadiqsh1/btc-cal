<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title> Crypto Calculator</title>

  <!-- Google AdSense Site Verification -->
  <meta name="google-adsense-account" content="ca-pub-4630520083562145">

  <!-- Google AdSense Script -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4630520083562145"
    crossorigin="anonymous"></script>

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #0d1117, #161b22);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    h1 {
      font-size: 2em;
      color: #00c3ff;
      text-shadow: 0 0 10px #00c3ff;
      animation: glow 2s infinite alternate;
      text-align: center;
    }

    @keyframes glow {
      from { text-shadow: 0 0 10px #00c3ff; }
      to { text-shadow: 0 0 20px #00ff88; }
    }

    .calculator {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
      width: 90%;
      max-width: 400px;
      text-align: center;
      backdrop-filter: blur(10px);
    }

    input, button {
      width: 90%;
      padding: 10px;
      margin: 8px 0;
      border-radius: 10px;
      border: none;
      font-size: 1em;
    }

    input {
      background: #222;
      color: #fff;
      border: 1px solid #333;
      outline: none;
    }

    button {
      background: #00c3ff;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #00ff88;
      transform: scale(1.05);
    }

    .result {
      margin-top: 20px;
      font-size: 1.2em;
      color: #00ff88;
      font-weight: bold;
    }

    .ad-box {
      margin: 20px auto;
      background: rgba(255,255,255,0.08);
      border-radius: 10px;
      padding: 10px;
      color: #aaa;
      font-size: 0.9em;
      text-align: center;
      width: 90%;
      max-width: 400px;
    }

    footer {
      margin-top: 20px;
      font-size: 0.85em;
      color: #888;
      text-align: center;
    }
  </style>
</head>
<body>

  <h1>Sadiq Trade Calculator 💹</h1>

  <!-- 🔹 Top Ad Placeholder -->
  <div class="ad-box">
    <!-- Replace with AdSense ad unit -->
    <ins class="adsbygoogle"
         style="display:block"
         data-ad-client="ca-pub-4630520083562145"
         data-ad-slot="5203984583"
         data-ad-format="auto"
         data-full-width-responsive="true"></ins>
    <script>
      (adsbygoogle = window.adsbygoogle || []).push({});
    </script>
  </div>

  <div class="calculator">
    <input type="number" id="entry" placeholder="Entry Price (USD)">
    <input type="number" id="exit" placeholder="Exit Price (USD)">
    <input type="number" id="investment" placeholder="Investment (PKR)">
    <input type="number" id="rate" placeholder="USD to PKR Rate" value="278">
    <input type="number" id="leverage" placeholder="Leverage (e.g. 10x)">
    <button onclick="calculate()">Calculate Profit/Loss</button>
    <div class="result" id="result"></div>
  </div>

  <!-- 🔹 Bottom Ad Placeholder -->
  <div class="ad-box">
    <!-- Replace with AdSense ad unit -->
    <ins class="adsbygoogle"
         style="display:block"
         data-ad-client="ca-pub-4630520083562145"
         data-ad-slot="5203984583"
         data-ad-format="auto"
         data-full-width-responsive="true"></ins>
    <script>
      (adsbygoogle = window.adsbygoogle || []).push({});
    </script>
  </div>

  <footer>© 2025 Sadiq Trade Calculator | All Rights Reserved</footer>

  <script>
    function calculate() {
      const entry = parseFloat(document.getElementById("entry").value);
      const exit = parseFloat(document.getElementById("exit").value);
      const investment_pkr = parseFloat(document.getElementById("investment").value);
      const rate = parseFloat(document.getElementById("rate").value);
      const leverage = parseFloat(document.getElementById("leverage").value);

      if (!entry || !exit || !investment_pkr || !rate || !leverage) {
        document.getElementById("result").innerHTML = "⚠️ Please fill all fields!";
        return;
      }

      const investment_usd = investment_pkr / rate;
      const priceChange = ((exit - entry) / entry) * 100;
      const pl_percent = priceChange * leverage;
      const pl_usd = (pl_percent / 100) * investment_usd;
      const pl_pkr = pl_usd * rate;

      let resultText = "";
      if (pl_pkr >= 0) {
        resultText = `🚀 Profit: ${pl_pkr.toFixed(2)} PKR (${pl_percent.toFixed(2)}%)`;
      } else {
        resultText = `💀 Loss: ${pl_pkr.toFixed(2)} PKR (${pl_percent.toFixed(2)}%)`;
      }

      document.getElementById("result").innerHTML = resultText;
    }
  </script>

</body>
</html>
